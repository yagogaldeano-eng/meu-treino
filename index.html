<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Meu Treino V4.5</title>
<style>
:root{--bg:#080808;--card:#151515;--card2:#1e1e1e;--line:#303030;--text:#f4f4f4;--muted:#999;--yellow:#ffd400;--yellow2:#b99b00;--good:#80d29b;--bad:#ff7474}
*{box-sizing:border-box} html,body{max-width:100%;overflow-x:hidden}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}button{cursor:pointer}input,textarea,select{font-size:16px}
header{position:sticky;top:0;z-index:30;background:rgba(8,8,8,.96);backdrop-filter:blur(14px);border-bottom:1px solid #242424;padding:calc(12px + env(safe-area-inset-top)) 14px 11px}
.header-row{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:21px;font-weight:950;color:var(--yellow);letter-spacing:.3px}.sub{font-size:12px;color:var(--muted)}
main{max-width:900px;margin:auto;padding:14px 14px 112px}.card{background:var(--card);border:1px solid #262626;border-radius:18px;padding:14px;margin:10px 0;min-width:0;max-width:100%;overflow:hidden}.soft{background:var(--card2)}.hero{background:linear-gradient(145deg,#1c1c1c,#0d0d0d)}
h2{font-size:18px;margin:0 0 7px}h3{font-size:15px;margin:0 0 5px}.muted{font-size:13px;color:var(--muted)}.tiny{font-size:11px;color:#7f7f7f}.yellow{color:var(--yellow)}.good{color:var(--good)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}.row>*{min-width:0}.wrap{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.action{border:1px solid #393939;background:#1c1c1c;color:#eee;padding:10px 12px;border-radius:12px;min-height:43px}.action.primary{background:var(--yellow);border-color:var(--yellow);color:#080808;font-weight:900}.action.danger{border-color:#673535;color:#ff9a9a}.action.small{padding:7px 9px;min-height:36px;font-size:12px}.action.ghost{background:transparent}
.pill{font-size:11px;border:1px solid #3a3a3a;border-radius:99px;padding:5px 8px;color:#bdbdbd;white-space:nowrap}.pill.y{background:#312a00;border-color:#635400;color:#ffe66c}
.metric{font-size:29px;font-weight:950;color:var(--yellow)}.home-plan{font-size:clamp(24px,6vw,36px);line-height:1.08}.metric-sm{font-size:20px;font-weight:900}.progress{height:8px;background:#2b2b2b;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;background:var(--yellow)}
.bottom{position:fixed;z-index:50;bottom:0;left:0;right:0;background:rgba(10,10,10,.98);border-top:1px solid #2a2a2a;padding:7px 4px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:0}.bottom button{border:0;background:transparent;color:#919191;padding:6px 8px;font-size:10px;min-width:58px}.bottom button.active{color:#fff}.bottom button.active .ico{color:var(--yellow)}.bottom .ico{display:block;font-size:18px;color:var(--yellow);margin-bottom:2px}
.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0 12px}.tab{border:1px solid #353535;background:#1c1c1c;color:#ddd;border-radius:12px;padding:9px 11px;white-space:nowrap}.tab.active{background:var(--yellow);border-color:var(--yellow);color:#080808;font-weight:900}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.wday{background:#1e1e1e;border:1px solid #2c2c2c;border-radius:11px;text-align:center;padding:7px 2px}.wday.today{border-color:var(--yellow)}.wday.done{background:#312a00}
.activity{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#1d1d1d;border-radius:13px;padding:11px;margin:8px 0}.check{width:32px;height:32px;border-radius:9px;border:1px solid #555;background:#101010;color:#101010;font-weight:900}.check.done{background:var(--yellow);border-color:var(--yellow);color:#080808}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}label{font-size:12px;color:#999;display:block}input,textarea,select{width:100%;max-width:100%;min-width:0;border:1px solid #3a3a3a;background:#0f0f0f;color:white;border-radius:11px;padding:10px;margin-top:4px}textarea{min-height:70px;resize:vertical}
.exercise-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.machine-art{width:76px;min-height:62px;border:1px solid #3a3a3a;border-radius:12px;background:#101010;display:flex;align-items:center;justify-content:center;color:var(--yellow);font-weight:900;font-size:10px;text-align:center;padding:5px}
.sets{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}.set{width:40px;height:40px;border-radius:50%;border:1px solid #484848;background:#202020;color:#eee;font-weight:900}.set.done{background:var(--yellow);border-color:var(--yellow);color:#080808}.set.skip{background:#3b2525;border-color:#714040;color:#ffb0b0}
.altbox{background:#242000;border:1px solid #5c4e00;border-radius:11px;padding:9px;margin-top:8px;font-size:13px}.historyline{font-size:12px;color:#aaa;margin-top:7px}.exercise-card.finished{border-color:#665800;background:#191804}.exercise-done-badge{font-size:11px;border-radius:99px;padding:5px 8px;background:#ffd400;color:#080808;font-weight:900}.exercise-summary{padding:3px 0}.exercise-card.finished .exercise-body{display:none}.exercise-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.exercise-actions .action{white-space:normal}
.timer-float{position:fixed;right:14px;bottom:92px;z-index:45;background:var(--yellow);color:#080808;border-radius:16px;padding:10px 12px;font-weight:900;box-shadow:0 8px 30px #0008;display:none}.timer-float.show{display:block}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calname{font-size:10px;color:#777;text-align:center}.cell{min-height:76px;background:#171717;border:1px solid #292929;border-radius:10px;padding:6px;font-size:12px}.cell.today{border-color:var(--yellow)}.cell.selected{outline:2px solid var(--yellow)}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}.dot{width:7px;height:7px;border-radius:50%;background:#555}.dot.m{background:var(--yellow)}.dot.r{background:#bbb}.dot.t{background:#777}.planmark{font-size:9px;color:#7b7b7b;margin-top:3px}
.chartbox{background:#0f0f0f;border:1px solid #292929;border-radius:14px;padding:10px;margin-top:8px;overflow:hidden}.chart{width:100%;height:190px;display:block}.chart text{fill:#7e7e7e;font-size:9px}.chart .line{fill:none;stroke:var(--yellow);stroke-width:3}.chart .goal{stroke:#555;stroke-dasharray:5 5}.chart .point{fill:var(--yellow)}.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;margin-top:8px}.barcol{display:flex;flex-direction:column;justify-content:end;gap:3px;height:100%;text-align:center}.barseg{border-radius:5px 5px 2px 2px;min-height:2px}.barseg.m{background:var(--yellow)}.barseg.t{background:#888}.barseg.r{background:#c7c7c7}.barlabel{font-size:9px;color:#777}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#1d1d1d;border-radius:13px;padding:10px;min-width:0}.stat b{display:block;color:var(--yellow);font-size:20px}.stat span{font-size:10px;color:#858585}
.editrow{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #292929}.dragbtns{display:flex;gap:4px}.schedrow{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin:7px 0}.checktype{display:grid;grid-template-columns:1fr auto;gap:8px;margin:6px 0}
.modal{position:fixed;inset:0;background:#000c;z-index:90;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(900px,100%);max-height:90vh;overflow:auto;background:#161616;border:1px solid #353535;border-radius:22px 22px 0 0;padding:15px 15px calc(18px + env(safe-area-inset-bottom))}
.notice{font-size:12px;color:#8d8d8d;line-height:1.45}.milestones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}.milestone{background:#1b1b1b;border:1px solid #303030;border-radius:12px;padding:9px;text-align:center}.milestone.done{background:#302900;border-color:#665800}.milestone b{display:block;font-size:18px;color:var(--yellow)}.run-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.post-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}.weekavg{font-size:12px;color:#aaa;margin-top:6px}.divider{border-top:1px solid #292929;margin:12px 0}
@media(max-width:650px){.exercise-actions{grid-template-columns:repeat(2,minmax(0,1fr))}
.bottom{padding-left:2px;padding-right:2px}
.bottom button{font-size:9px;min-width:0;flex:1;padding:6px 2px}
.bottom .ico{font-size:17px}
.metric{font-size:25px}
.metric-sm{font-size:18px}
.card{border-radius:16px;padding:13px}
.hero .metric{line-height:1.08}
.weekstrip{gap:4px}
.wday{padding:6px 1px}
.machine-art{width:58px;min-height:54px;font-size:9px}
.exercise-top{grid-template-columns:minmax(0,1fr) 58px}
.action.small{font-size:11px;padding:7px 8px}
.row.wrap{gap:6px}
.fields{grid-template-columns:1fr 1fr}
.measure-grid{grid-template-columns:1fr!important}
.measure-grid input{min-height:48px}
.calendar{gap:4px}
.cell{min-height:62px;padding:5px}
.planmark{font-size:10px;line-height:1.15}
}
@media(max-width:390px){.milestones{grid-template-columns:repeat(2,minmax(0,1fr))}.run-summary,.post-summary{grid-template-columns:repeat(2,minmax(0,1fr))}
.bottom button{font-size:8px}
.bottom .ico{font-size:16px}
.fields{grid-template-columns:1fr}
.grid3{grid-template-columns:1fr 1fr}
.weekstrip{gap:3px}
.card{padding:12px}
}.grid4,.statgrid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.machine-art{width:66px}.cell{min-height:67px}.schedrow{grid-template-columns:65px 1fr}}
</style>
</head>
<body>
<header><div class="header-row"><div><div class="brand" id="brand">MEU TREINO</div><div class="sub" id="brandSub">98 kg → 80 kg • musculação + corrida + Muay Thai</div></div><button class="action small ghost" onclick="showBackup()">⋯</button></div></header>
<main id="view"></main>
<div id="timerFloat" class="timer-float" onclick="openTimer()"></div>

<button data-nav="today" onclick="showToday()"><span class="ico">⌂</span>Hoje</button>
<button data-nav="workout" onclick="showWorkout()"><span class="ico">✓</span>Treino</button>
<button data-nav="calendar" onclick="showCalendar()"><span class="ico">□</span>Calendário</button>
<button data-nav="progress" onclick="showProgress()"><span class="ico">↘</span>Evolução</button>
<button data-nav="edit" onclick="showEdit()"><span class="ico">✎</span>Editar</button>
<button data-nav="dash" onclick="showDashboard()"><span class="ico">▤</span>Dash</button>
</nav>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div>

<script>
const DEFAULT_WORKOUTS={"dia1": {"title": "Dia 1", "subtitle": "Pernas + Abdômen", "exercises": [{"name": "Hack Squat", "sets": 4, "repRange": "6–10", "rest": 120, "muscles": "Quadríceps • glúteos", "alternatives": ["Leg Press 45°", "Agachamento no Smith"], "how": "Apoie costas e ombros. Pés firmes na plataforma. Desça controlando os joelhos na direção dos pés e suba sem travar agressivamente os joelhos.", "machine": "Máquina inclinada com plataforma para os pés e apoios nos ombros.", "visual": "hack"}, {"name": "Leg Press 45°", "sets": 3, "repRange": "10–12", "rest": 105, "muscles": "Quadríceps • glúteos", "alternatives": ["Hack Squat", "Leg Press horizontal"], "how": "Mantenha toda a planta dos pés na plataforma. Desça até onde a lombar continue apoiada e empurre com joelhos alinhados.", "machine": "Banco inclinado voltado para uma grande plataforma móvel.", "visual": "legpress"}, {"name": "Cadeira Extensora", "sets": 3, "repRange": "12–15", "rest": 70, "muscles": "Quadríceps", "alternatives": ["Agachamento Goblet", "Sissy squat assistido"], "how": "Alinhe o joelho ao eixo da máquina. Estenda as pernas, contraia o quadríceps e retorne lentamente.", "machine": "Máquina sentada com um rolo acolchoado na frente das canelas.", "visual": "extension"}, {"name": "Cadeira / Mesa Flexora", "sets": 3, "repRange": "10–15", "rest": 75, "muscles": "Posterior de coxa", "alternatives": ["Flexora unilateral", "Stiff com halteres"], "how": "Flexione os joelhos mantendo quadril estável. Controle principalmente a volta.", "machine": "Cadeira com rolo atrás dos tornozelos ou mesa para executar deitado.", "visual": "curl"}, {"name": "Stiff / RDL", "sets": 3, "repRange": "8–12", "rest": 105, "muscles": "Posterior • glúteos", "alternatives": ["Stiff com halteres", "Extensão de quadril + flexora"], "how": "Joelhos levemente flexionados. Leve o quadril para trás com coluna neutra e mantenha o peso próximo das pernas.", "machine": "Normalmente feito com barra ou halteres; não depende de máquina.", "visual": "barbell"}, {"name": "Panturrilha", "sets": 4, "repRange": "12–20", "rest": 60, "muscles": "Panturrilhas", "alternatives": ["Panturrilha no Leg Press", "Panturrilha sentado"], "how": "Desça os calcanhares de forma controlada e suba até contrair bem a panturrilha. Evite quicar.", "machine": "Pode ser máquina em pé, sentada ou o próprio Leg Press.", "visual": "calf"}, {"name": "Abdominal máquina", "sets": 3, "repRange": "10–15", "rest": 60, "muscles": "Abdômen", "alternatives": ["Crunch na polia", "Crunch no solo"], "how": "Aproxime costelas e pelve. Evite puxar apenas com braços e pescoço.", "machine": "Máquina sentada com apoio no peito ou braços que permite flexionar o tronco.", "visual": "ab"}, {"name": "Elevação de pernas", "sets": 3, "repRange": "10–15", "rest": 60, "muscles": "Core • abdômen", "alternatives": ["Reverse crunch", "Elevação de joelhos na cadeira romana"], "how": "Controle a pelve e evite embalo. Se a lombar perder a posição, flexione os joelhos.", "machine": "Pode ser feita no banco, barra fixa ou cadeira romana.", "visual": "roman"}]}, "dia2": {"title": "Dia 2", "subtitle": "Peito + Ombros + Tríceps + Abdômen", "exercises": [{"name": "Supino reto", "sets": 4, "repRange": "6–10", "rest": 120, "muscles": "Peito • tríceps • ombro anterior", "alternatives": ["Chest Press máquina", "Supino com halteres"], "how": "Pés firmes e escápulas apoiadas. Desça com controle até o peito e empurre mantendo punhos estáveis.", "machine": "Banco reto com suporte para barra ou máquina Chest Press.", "visual": "bench"}, {"name": "Supino inclinado", "sets": 3, "repRange": "8–12", "rest": 100, "muscles": "Peito superior", "alternatives": ["Chest Press inclinado", "Supino inclinado com halteres"], "how": "Use inclinação moderada. Mantenha escápulas apoiadas e desça os pesos ao lado do peito.", "machine": "Banco inclinado ou máquina de empurrar com encosto inclinado.", "visual": "incline"}, {"name": "Peck Deck", "sets": 3, "repRange": "10–15", "rest": 75, "muscles": "Peitoral", "alternatives": ["Crucifixo no cabo", "Crucifixo com halteres"], "how": "Peito aberto. Aproxime os braços sem projetar excessivamente os ombros para frente.", "machine": "Máquina sentada com dois braços/alavancas que fecham à frente do peito.", "visual": "pecdeck"}, {"name": "Shoulder Press", "sets": 3, "repRange": "8–12", "rest": 100, "muscles": "Ombros • tríceps", "alternatives": ["Desenvolvimento com halteres", "Desenvolvimento no Smith"], "how": "Abdômen firme. Empurre acima da cabeça sem arquear excessivamente a lombar.", "machine": "Máquina sentada com pegadores na altura dos ombros que sobem acima da cabeça.", "visual": "shoulder"}, {"name": "Elevação lateral", "sets": 4, "repRange": "12–15", "rest": 65, "muscles": "Deltoide lateral", "alternatives": ["Máquina lateral", "Elevação unilateral no cabo"], "how": "Cotovelos levemente flexionados. Suba até perto da linha dos ombros sem embalar o tronco.", "machine": "Halteres, polia baixa ou máquina específica de elevação lateral.", "visual": "lateral"}, {"name": "Tríceps na polia", "sets": 3, "repRange": "10–15", "rest": 65, "muscles": "Tríceps", "alternatives": ["Tríceps máquina", "Tríceps francês"], "how": "Cotovelos próximos ao corpo. Estenda sem balançar ombros e tronco.", "machine": "Polia alta com barra reta ou corda.", "visual": "cable"}, {"name": "Crunch na polia", "sets": 3, "repRange": "10–15", "rest": 60, "muscles": "Abdômen", "alternatives": ["Abdominal máquina", "Crunch no solo"], "how": "Flexione o tronco aproximando costelas e pelve, sem simplesmente puxar a corda com os braços.", "machine": "Polia alta com corda; normalmente executado ajoelhado.", "visual": "cableab"}]}, "dia3": {"title": "Dia 3", "subtitle": "Pernas + Costas + Ombros + Abdômen", "exercises": [{"name": "Agachamento Búlgaro", "sets": 3, "repRange": "8–12 / perna", "rest": 90, "muscles": "Quadríceps • glúteos", "alternatives": ["Afundo no Smith", "Leg Press unilateral"], "how": "Pé da frente firme e pé traseiro apoiado. Desça verticalmente e suba empurrando o chão com a perna da frente.", "machine": "Banco baixo atrás de você e halteres; alternativa guiada no Smith.", "visual": "bulgarian"}, {"name": "Leg Press / Hack", "sets": 3, "repRange": "10–12", "rest": 105, "muscles": "Quadríceps • glúteos", "alternatives": ["Hack Squat", "Agachamento Smith"], "how": "Mantenha joelhos acompanhando a direção dos pés e controle a amplitude.", "machine": "Leg Press 45° ou Hack Squat, conforme disponibilidade.", "visual": "legpress"}, {"name": "Cadeira Flexora", "sets": 3, "repRange": "10–15", "rest": 75, "muscles": "Posterior de coxa", "alternatives": ["Mesa flexora", "Stiff leve"], "how": "Flexione os joelhos mantendo quadril estável e controle a volta.", "machine": "Máquina sentada com rolo atrás dos tornozelos.", "visual": "curl"}, {"name": "Puxada alta", "sets": 3, "repRange": "8–12", "rest": 90, "muscles": "Dorsais • bíceps", "alternatives": ["Pulldown articulado", "Puxada neutra"], "how": "Puxe em direção à parte superior do peito levando os cotovelos para baixo, sem balançar o tronco.", "machine": "Polia alta com barra longa ou máquina articulada de puxada.", "visual": "latpull"}, {"name": "Remada baixa", "sets": 3, "repRange": "8–12", "rest": 90, "muscles": "Costas • bíceps", "alternatives": ["Remada articulada", "Remada com apoio no peito"], "how": "Tronco estável. Leve cotovelos para trás e aproxime as escápulas sem jogar o corpo.", "machine": "Polia baixa com banco e pegador ou máquina de remada sentada.", "visual": "row"}, {"name": "Elevação lateral", "sets": 3, "repRange": "12–15", "rest": 65, "muscles": "Deltoide lateral", "alternatives": ["Máquina lateral", "Cabo unilateral"], "how": "Suba os braços lateralmente com controle e sem encolher excessivamente os ombros.", "machine": "Halteres, polia ou máquina específica.", "visual": "lateral"}, {"name": "Crucifixo inverso", "sets": 3, "repRange": "12–15", "rest": 70, "muscles": "Ombro posterior", "alternatives": ["Reverse Peck Deck", "Face Pull"], "how": "Abra os braços concentrando o esforço na parte posterior dos ombros. Evite transformar o movimento em remada.", "machine": "Peck Deck usado ao contrário ou cabos.", "visual": "reversepec"}, {"name": "Prancha", "sets": 3, "repRange": "30–60 s", "rest": 50, "muscles": "Core", "alternatives": ["Dead bug", "Prancha apoiada"], "how": "Contraia abdômen e glúteos mantendo tronco e quadril alinhados. Pare a série quando perder a posição.", "machine": "Não requer máquina.", "visual": "plank"}]}};
const BUILTIN_REFERENCES={"hack squat": "https://musclewiki.com/pt-br/exercise/machine-hack-squat", "leg press 45°": "https://musclewiki.com/pt-br/exercise/machine-leg-press", "leg press / hack": "https://musclewiki.com/pt-br/exercise/machine-leg-press", "cadeira extensora": "https://musclewiki.com/pt-br/exercise/machine-leg-extension", "stiff / rdl": "https://musclewiki.com/pt-br/exercise/dumbbell-romanian-deadlift", "panturrilha": "https://musclewiki.com/pt-br/exercise/machine-seated-calf-raises", "abdominal máquina": "https://musclewiki.com/pt-br/exercise/machine-crunch", "supino reto": "https://musclewiki.com/pt-br/exercise/barbell-bench-press?model=m", "supino inclinado": "https://musclewiki.com/pt-br/exercise/dumbbell-high-incline-bench-press", "tríceps na polia": "https://musclewiki.com/pt-br/exercise/cable-rope-pushdown", "agachamento búlgaro": "https://musclewiki.com/pt-br/exercise/barbell-bulgarian-split-squat", "puxada alta": "https://musclewiki.com/pt-br/exercise/machine-pulldown", "remada baixa": "https://musclewiki.com/pt-br/exercise/machine-seated-cable-row"};
function normalizeExerciseName(n){return (n||'').toLowerCase().trim()}
function referenceUrl(ex){return ex.referenceUrl||BUILTIN_REFERENCES[normalizeExerciseName(ex.name)]||''}

 {id:'corrida',name:'Corrida',icon:'🏃'},
 {id:'muay',name:'Muay Thai',icon:'🥊'},
 {id:'musculacao',name:'Musculação',icon:'🏋'}
];

 {kind:'workout',value:'dia1'},
 {kind:'checkin',value:'muay'},
 {kind:'workout',value:'dia2'},
 {kind:'checkin',value:'muay'},

function pad(n){return String(n).padStart(2,'0')}function ymd(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function brDate(ds){let [y,m,d]=ds.split('-');return d+'/'+m+'/'+y}

function uniqueDoneDaysInRange(start,end){let set=new Set();Object.entries(state.activities).forEach(([k,v])=>{if(!v.done)return;let ds=k.split('|')[0];if(ds>=start&&ds<=end)set.add(ds)});return set.size}
function latestMeasure(){return state.measurements.length?state.measurements[state.measurements.length-1]:{weight:state.profile.startWeight||98,waist:null,chest:null}}
function paceFrom(km,min){km=Number(km)||0;min=Number(min)||0;if(km<=0||min<=0)return null;let p=min/km,whole=Math.floor(p),sec=Math.round((p-whole)*60);if(sec===60){whole++;sec=0}return `${whole}:${String(sec).padStart(2,'0')} min/km`}
function allRuns(){let out=[];Object.entries(state.activities).forEach(([k,v])=>{if(!v||!v.done)return;let [date,type]=k.split('|');if(type==='corrida'&&Number(v.km)>0&&Number(v.min)>0)out.push({date,km:Number(v.km),min:Number(v.min),paceMin:Number(v.min)/Number(v.km)})});return out.sort((a,b)=>a.date.localeCompare(b.date))}
function runStatsForMonth(date=new Date()){let p=date.getFullYear()+'-'+pad(date.getMonth()+1)+'-',r=allRuns().filter(x=>x.date.startsWith(p)),km=r.reduce((s,x)=>s+x.km,0),min=r.reduce((s,x)=>s+x.min,0);return {count:r.length,km,min,avgKm:r.length?km/r.length:0,avgPace:km?min/km:null,longest:r.length?Math.max(...r.map(x=>x.km)):0}}
function weeklyWeightAverage(offsetWeeks=0){let mon=mondayOf(new Date());mon.setDate(mon.getDate()+offsetWeeks*7);let start=ymd(mon),end=new Date(mon);end.setDate(end.getDate()+6);let ee=ymd(end),arr=state.measurements.filter(x=>Number(x.weight)>0&&x.date>=start&&x.date<=ee).map(x=>Number(x.weight));return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null}

function finalizeSessionCore(){

 d.exercises.forEach(ex=>{let x=draft[ex.name]||{sets:[],kg:'',reps:'',note:'',skipped:false,substitute:'',finished:false};s.exercises.push({name:x.substitute||ex.name,originalName:ex.name,kg:x.kg,reps:x.reps,note:x.note,setsDone:x.sets.filter(Boolean).length,totalSets:ex.sets,skipped:x.skipped,finished:x.finished,substituted:!!x.substitute})});

function startTimer(sec){ensureSessionStart();timerEnd=Date.now()+sec*1000;if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(tickTimer,250);tickTimer()}function tickTimer(){let l=Math.max(0,Math.ceil((timerEnd-Date.now())/1000)),e=document.getElementById('timerFloat');if(l<=0){clearInterval(timerInterval);e.classList.remove('show');if(navigator.vibrate)navigator.vibrate([150,80,150]);return}e.textContent='⏱ '+Math.floor(l/60)+':'+pad(l%60);e.classList.add('show')}function openTimer(){let l=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));modal(`<h2>Descanso</h2><div class="metric">${Math.floor(l/60)}:${pad(l%60)}</div><div class="grid3"><button class="action" onclick="startTimer(60);closeModal()">60s</button><button class="action" onclick="startTimer(90);closeModal()">90s</button><button class="action" onclick="startTimer(120);closeModal()">120s</button></div>`)}

function weeklyActivityData(){
 let out=[];let thisMon=mondayOf(new Date());
 for(let w=5;w>=0;w--){let s=new Date(thisMon);s.setDate(s.getDate()-7*w);let e=new Date(s);e.setDate(e.getDate()+6);let ss=ymd(s),ee=ymd(e),counts={musculacao:0,muay:0,corrida:0};Object.entries(state.activities).forEach(([k,v])=>{if(!v.done)return;let [ds,t]=k.split('|');if(ds>=ss&&ds<=ee&&counts[t]!==undefined)counts[t]++});out.push({label:`${s.getDate()}/${s.getMonth()+1}`,...counts})}return out
}
function volumeBySession(){return state.sessions.slice(-8).map(s=>{let vol=s.exercises.reduce((sum,e)=>sum+(Number(e.kg)||0)*(Number(e.reps)||0)*(Number(e.setsDone)||0),0);return {date:s.date,value:Math.round(vol)}})}
function lineSVG(data,label,goal=null){
 if(data.length<2)return `<div class="chartbox muted">Registre pelo menos 2 pontos para formar a tendência.</div>`;
 let vals=data.map(x=>Number(x.value)),W=700,H=190,p=25,min=Math.min(...vals,goal??Infinity),max=Math.max(...vals,goal??-Infinity);if(min===max){min-=1;max+=1}let sx=i=>p+i*(W-2*p)/(data.length-1),sy=v=>H-p-(v-min)*(H-2*p)/(max-min),pts=data.map((x,i)=>`${sx(i)},${sy(x.value)}`).join(' ');
 return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${goal!==null?`<line class="goal" x1="${p}" x2="${W-p}" y1="${sy(goal)}" y2="${sy(goal)}"/><text x="${W-100}" y="${sy(goal)-5}">meta ${goal}</text>`:''}<polyline class="line" points="${pts}"/>${data.map((x,i)=>`<circle class="point" cx="${sx(i)}" cy="${sy(x.value)}" r="4"/>`).join('')}<text x="8" y="14">${max.toFixed(1)}</text><text x="8" y="${H-7}">${min.toFixed(1)}</text><text x="${W/2-35}" y="${H-7}">${label}</text></svg></div>`
}
function activityBars(){let d=weeklyActivityData(),max=Math.max(1,...d.map(x=>x.musculacao+x.muay+x.corrida));return `<div class="bars">${d.map(x=>{let total=x.musculacao+x.muay+x.corrida;let scale=120/max;return `<div class="barcol"><div class="barseg r" style="height:${x.corrida*scale}px" title="Corrida ${x.corrida}"></div><div class="barseg t" style="height:${x.muay*scale}px" title="Muay ${x.muay}"></div><div class="barseg m" style="height:${x.musculacao*scale}px" title="Musculação ${x.musculacao}"></div><div class="barlabel">${x.label}<br>${total}</div></div>`}).join('')}</div><div class="notice"><span class="dot m"></span> musculação &nbsp; <span class="dot t"></span> Muay Thai &nbsp; <span class="dot r"></span> corrida</div>`}
function topPRs(){let map={};state.sessions.forEach(s=>s.exercises.forEach(e=>{let kg=Number(e.kg)||0;if(kg>0)map[e.originalName||e.name]=Math.max(map[e.originalName||e.name]||0,kg)}));return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5)}
function showDashboard(){setNav('dash');
 let l=latestMeasure(),start=Number(state.profile.startWeight)||98,goal=Number(state.profile.goalWeight)||80,current=Number(l.weight)||start,pct=Math.max(0,Math.min(100,(start-current)/(start-goal)*100));
 let now=new Date(),monthMus=countMonth('musculacao'),monthMuay=countMonth('muay'),monthRun=countMonth('corrida'),week=currentWeekDates(),weekDone=week.filter(d=>anyDone(ymd(d))).length;
 let weights=state.measurements.filter(x=>x.weight).slice(-12).map(x=>({date:x.date,value:x.weight})),waists=state.measurements.filter(x=>x.waist).slice(-12).map(x=>({date:x.date,value:x.waist})),vol=volumeBySession(),wavg=weeklyWeightAverage(0),prevAvg=weeklyWeightAverage(-1),run=runStatsForMonth(now),avgDelta=(wavg!==null&&prevAvg!==null)?wavg-prevAvg:null;
 document.getElementById('view').innerHTML=`<div class="card hero"><div class="row"><div><div class="muted">PESO ATUAL</div><div class="metric">${current} kg</div>${wavg!==null?`<div class="weekavg">Média semanal: <b>${wavg.toFixed(1)} kg</b>${avgDelta!==null?` • ${avgDelta<0?'↓':'↑'} ${Math.abs(avgDelta).toFixed(1)} kg`:''}</div>`:''}</div><div style="text-align:right"><div class="muted">META FINAL</div><div class="metric">${goal} kg</div></div></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="milestones">${milestoneHtml(current)}</div></div>
 <div class="statgrid"><div class="stat"><b>${weekDone}/7</b><span>dias ativos na semana</span></div><div class="stat"><b>${monthMus}</b><span>musculações no mês</span></div><div class="stat"><b>${monthMuay}</b><span>Muay Thai no mês</span></div><div class="stat"><b>${monthRun}</b><span>corridas no mês</span></div></div>
 <div class="card"><div class="row"><h2>Corrida • este mês</h2><span class="pill y">${run.count} sessão(ões)</span></div><div class="run-summary"><div class="stat"><b>${run.km.toFixed(1)}</b><span>km totais</span></div><div class="stat"><b>${Math.round(run.min)}</b><span>minutos</span></div><div class="stat"><b>${run.avgPace?paceFrom(run.km,run.min):'—'}</b><span>ritmo médio</span></div></div><div class="muted" style="margin-top:8px">${run.count?`Média ${run.avgKm.toFixed(1)} km/corrida • maior distância ${run.longest.toFixed(1)} km`:'Preencha km e minutos nos check-ins para gerar as métricas.'}</div></div>
 <div class="card"><div class="row"><h2>Peso ao longo do tempo</h2><span class="pill y">média semanal acima</span></div>${lineSVG(weights,'Peso (kg)',goal)}</div>

 <div class="card"><h2>Volume registrado • últimos treinos</h2><div class="muted">Estimativa = carga × reps × séries concluídas dos exercícios com carga preenchida.</div>${lineSVG(vol,'Volume')}</div>
 <div class="card"><h2>Melhores cargas registradas</h2>${topPRs().map(([n,v])=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #292929"><span>${n}</span><b class="yellow">${v} kg</b></div>`).join('')||'<div class="muted">Ainda sem cargas registradas.</div>'}</div>`;
}

 let y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=(first.getDay()+6)%7,c='';for(let i=0;i<start;i++)c+='<div class="cell" style="opacity:.15"></div>';

 document.getElementById('view').innerHTML=`<div class="card"><div class="row"><button class="action small" onclick="calCursor=new Date(${y},${m-1},1);selectedDate=null;showCalendar()">‹</button><h2>${calCursor.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="action small" onclick="calCursor=new Date(${y},${m+1},1);selectedDate=null;showCalendar()">›</button></div><div class="calendar">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="calname">${x}</div>`).join('')}${c}</div><p class="notice">Texto = planejado • pontos = realizado.</p></div>${det}`;

 if(!state.workouts[editWorkoutKey])editWorkoutKey=Object.keys(state.workouts)[0];let w=state.workouts[editWorkoutKey],wTabs=Object.keys(state.workouts).map(k=>`<button class="tab ${k===editWorkoutKey?'active':''}" onclick="editWorkoutKey='${k}';showEdit()">${state.workouts[k].title}</button>`).join(''),exs=w.exercises.map((e,i)=>`<div class="editrow"><div><b>${e.name}</b><div class="muted">${e.sets} × ${e.repRange} • ${e.rest||90}s</div></div><div class="dragbtns"><button class="action small" onclick="moveEx(${i},-1)">↑</button><button class="action small" onclick="moveEx(${i},1)">↓</button><button class="action small" onclick="editExercise(${i})">Editar</button><button class="action small danger" onclick="deleteExercise(${i})">×</button></div></div>`).join('');

function addExercise(){editExercise(-1)}
function editExercise(i){let e=i>=0?state.workouts[editWorkoutKey].exercises[i]:{name:'',sets:3,repRange:'8–12',rest:90,muscles:'',alternatives:[],how:'',machine:'',visual:'EXERCÍCIO'};modal(`<h2>${i>=0?'Editar':'Novo'} exercício</h2><div class="grid2"><label>Nome<input id="eName" value="${e.name}"></label><label>Séries<input id="eSets" type="number" min="1" max="10" value="${e.sets}"></label><label>Repetições<input id="eReps" value="${e.repRange}"></label><label>Descanso (s)<input id="eRest" type="number" min="20" max="600" value="${e.rest||90}"></label></div><label>Músculos<input id="eMus" value="${e.muscles||''}"></label><label>Como executar<textarea id="eHow">${e.how||''}</textarea></label><label>Como identificar a máquina<textarea id="eMachine">${e.machine||''}</textarea></label><label>Alternativas (separe por vírgula)<input id="eAlt" value="${(e.alternatives||[]).join(', ')}"></label><label>Link de referência visual<input id="eRef" type="url" placeholder="https://..." value="${e.referenceUrl||referenceUrl(e)||''}"></label><label>Link de vídeo favorito<input id="eVideo" type="url" placeholder="Opcional — YouTube, Instagram, etc." value="${e.videoUrl||''}"></label><p class="notice">Sem vídeo favorito, o botão Vídeos abre uma busca automática pelo nome do exercício.</p><button class="action primary" style="width:100%;margin-top:10px" onclick="saveExercise(${i})">Salvar</button>`)}
function saveExercise(i){let e={name:document.getElementById('eName').value.trim(),sets:Math.max(1,Math.min(10,Number(document.getElementById('eSets').value)||3)),repRange:document.getElementById('eReps').value||'8–12',rest:Math.max(20,Math.min(600,Number(document.getElementById('eRest').value)||90)),muscles:document.getElementById('eMus').value,how:document.getElementById('eHow').value,machine:document.getElementById('eMachine').value,alternatives:document.getElementById('eAlt').value.split(',').map(x=>x.trim()).filter(Boolean),referenceUrl:document.getElementById('eRef').value.trim(),videoUrl:document.getElementById('eVideo').value.trim(),visual:'EXERCÍCIO'};if(!e.name)return;if(i>=0)state.workouts[editWorkoutKey].exercises[i]=e;else state.workouts[editWorkoutKey].exercises.push(e);save();closeModal();showEdit()}
function deleteExercise(i){if(confirm('Excluir exercício?')){state.workouts[editWorkoutKey].exercises.splice(i,1);save();showEdit()}}
function moveEx(i,d){let a=state.workouts[editWorkoutKey].exercises,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();showEdit()}
function restoreDefaults(){if(confirm('Restaurar treinos, agenda e check-ins padrão? Seus históricos serão mantidos.')){state.workouts=clone(DEFAULT_WORKOUTS);state.checkins=clone(DEFAULT_CHECKINS);state.schedule=clone(DEFAULT_SCHEDULE);workoutDay='dia1';editWorkoutKey='dia1';save();showEdit()}}

function showBackup(){modal(`<h2>Dados & backup</h2><p class="muted">Os dados ficam neste navegador. Exporte backup antes de limpar o Safari ou trocar de aparelho.</p><div class="grid2"><button class="action primary" onclick="exportData()">Exportar</button><label class="action" style="text-align:center">Importar<input type="file" accept="application/json" onchange="importData(this.files[0])" style="display:none"></label></div><button class="action" style="width:100%;margin-top:9px" onclick="installHelp()">Instalar no iPhone</button><button class="action" style="width:100%;margin-top:9px" onclick="closeModal()">Fechar</button><p class="notice">Este aplicativo organiza treino e evolução; não substitui orientação profissional individual.</p>`)}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meu-treino-backup-'+ymd()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();closeModal();showToday()}catch(e){alert('Backup inválido')}};r.readAsText(f)}
function installHelp(){modal(`<h2>Instalar no iPhone</h2><ol><li>Hospede a pasta do ZIP em HTTPS.</li><li>Abra no Safari.</li><li>Toque em Compartilhar.</li><li>Adicionar à Tela de Início.</li></ol><button class="action primary" onclick="closeModal()">Entendi</button>`)}

updateBrand();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
showToday();
</script>
</body>
</html>
